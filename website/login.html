<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Lost in the Alps</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .login-box {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
        animation: fadeInUp 0.6s ease;
      }

      .login-box h1 {
        margin: 0 0 10px 0;
        color: #1e3a8a;
        font-size: 28px;
        text-align: center;
      }

      .login-box p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .toggle-form {
        text-align: center;
        margin-top: 20px;
        color: #666;
      }

      .toggle-form a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
      }

      .toggle-form a:hover {
        text-decoration: underline;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }

      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: white;
        text-decoration: none;
        font-size: 14px;
        opacity: 0.9;
      }

      .back-link a:hover {
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <h1 id="formTitle">Login</h1>
        <p id="formSubtitle">Access your favorite mountain huts</p>

        <div id="alertBox"></div>

        <form id="authForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="your@email.com"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
            />
          </div>

          <button type="submit" class="btn-login" id="submitBtn">Login</button>
        </form>

        <div class="toggle-form">
          <span id="toggleText">Don't have an account?</span>
          <a href="#" id="toggleLink">Register</a>
        </div>

        <div class="back-link">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </div>

    <script>
      // Simple localStorage-based authentication (no server needed)
      let isLoginMode = true;

      const form = document.getElementById("authForm");
      const formTitle = document.getElementById("formTitle");
      const formSubtitle = document.getElementById("formSubtitle");
      const submitBtn = document.getElementById("submitBtn");
      const toggleText = document.getElementById("toggleText");
      const toggleLink = document.getElementById("toggleLink");
      const alertBox = document.getElementById("alertBox");

      // Toggle between login and register
      toggleLink.addEventListener("click", (e) => {
        e.preventDefault();
        isLoginMode = !isLoginMode;

        if (isLoginMode) {
          formTitle.textContent = "Login";
          formSubtitle.textContent = "Access your favorite mountain huts";
          submitBtn.textContent = "Login";
          toggleText.textContent = "Don't have an account?";
          toggleLink.textContent = "Register";
        } else {
          formTitle.textContent = "Register";
          formSubtitle.textContent = "Create your account";
          submitBtn.textContent = "Register";
          toggleText.textContent = "Already have an account?";
          toggleLink.textContent = "Login";
        }

        clearAlert();
      });

      // Handle form submission
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showAlert("Please fill in all fields", "error");
          return;
        }

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Processing...";

        if (isLoginMode) {
          // Login logic
          const users = JSON.parse(localStorage.getItem("users") || "{}");

          if (users[email] && users[email].password === password) {
            showAlert("Login successful!", "success");

            // Store current user
            localStorage.setItem(
              "currentUser",
              JSON.stringify({
                email: email,
                user_id: users[email].user_id,
              })
            );

            // Redirect to map
            setTimeout(() => {
              window.location.href = "map.html";
            }, 1000);
          } else {
            showAlert("Invalid email or password", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
          }
        } else {
          // Register logic
          const users = JSON.parse(localStorage.getItem("users") || "{}");

          if (users[email]) {
            showAlert("Email already registered", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Register";
            return;
          }

          // Create new user
          users[email] = {
            password: password,
            user_id: Date.now(),
            created_at: new Date().toISOString(),
          };

          localStorage.setItem("users", JSON.stringify(users));

          // Initialize empty favorites for user
          const favorites = JSON.parse(
            localStorage.getItem("favorites") || "{}"
          );
          favorites[email] = [];
          localStorage.setItem("favorites", JSON.stringify(favorites));

          showAlert("Registration successful! Redirecting...", "success");

          // Auto-login
          localStorage.setItem(
            "currentUser",
            JSON.stringify({
              email: email,
              user_id: users[email].user_id,
            })
          );

          // Redirect to map
          setTimeout(() => {
            window.location.href = "map.html";
          }, 1500);
        }
      });

      function showAlert(message, type) {
        alertBox.innerHTML = `
          <div class="alert alert-${type}">
            ${message}
          </div>
        `;
      }

      function clearAlert() {
        alertBox.innerHTML = "";
      }

      // Check if already logged in
      window.addEventListener("load", () => {
        const currentUser = localStorage.getItem("currentUser");
        if (currentUser) {
          window.location.href = "map.html";
        }
      });
    </script>
  </body>
</html>
